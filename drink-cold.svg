<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
    <!-- glass -->
    <path d="M46,50 L114,50 L104,132 a10,10 0 0 1 -10,9 L66,141 a10,10 0 0 1 -10,-9 Z" fill="#fffaf1"
        stroke="#5b2a86" stroke-width="3" />
    <!-- liquid -->
    <path d="M50,66 L110,66 L102,128 a8,8 0 0 1 -8,7 L66,135 a8,8 0 0 1 -8,-7 Z" fill="#9fd3d8" opacity="0.85" />

    <!-- ice cubes -->
    <rect x="64" y="76" width="16" height="16" rx="3" fill="#ffffff" stroke="#5b2a86" stroke-width="1.5"
        opacity="0.9" />
    <rect x="82" y="92" width="14" height="14" rx="3" fill="#ffffff" stroke="#5b2a86" stroke-width="1.5"
        opacity="0.9" />

    <!-- straw -->
    <rect x="88" y="18" width="8" height="70" rx="4" fill="#d9a441" stroke="#5b2a86" stroke-width="2"
        transform="rotate(12 92 53)" />

    <!-- condensation -->
    <circle cx="52" cy="90" r="2" fill="#5b2a86" opacity="0.25" />
    <circle cx="48" cy="104" r="1.5" fill="#5b2a86" opacity="0.25" />
    <circle cx="108" cy="98" r="2" fill="#5b2a86" opacity="0.25" />
</svg>
